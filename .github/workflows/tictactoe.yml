name: Tic-tac-toe

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: tictactoe
  cancel-in-progress: false

jobs:
  move:
    if: startsWith(github.event.issue.title, 'ttt|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Play move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: python3 scripts/ttt.py

      - name: Commit board
        env:
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tictactoe/state.json
          if git commit -m "Tic-tac-toe: move by ${ISSUE_USER}"; then
            for attempt in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi

      - name: Reply and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file reply.md
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
